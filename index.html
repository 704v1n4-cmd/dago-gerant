<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dago Gérant">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Dago Moto Shop — Gérant</title>
<link rel="preload" href="Inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;src:url(Inter.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#fafafa;--ink:#09090b;--mute:#71717a;--line:#e4e4e7;--soft:#f4f4f5;--lime:#96ff1a;--forest:#083300;--wash:#ecffd6;--red:#dc2626;--redbg:#fef2f2;--amber:#b45309;--amberbg:#fffbeb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-feature-settings:"cv05" 1,"cv08" 1,"tnum" 1;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:16px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.mh{padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.mh small{color:var(--mute);font-size:12.5px}.mh h1{margin:0;font-size:26px;letter-spacing:-.03em}
.sync{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--wash);color:var(--forest);white-space:nowrap}.sync.w{background:var(--amberbg);color:var(--amber)}
.warnbar{margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:var(--amberbg);color:#78350f;font-size:13px}
.body{flex:1;overflow:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:12px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:10px 2px -4px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px}.card.list{padding:4px 0}
.hero{background:var(--ink);color:#fff;border:0}.hero .l{color:#a1a1aa;font-size:12.5px}.hero .v{font-size:32px;font-weight:700;letter-spacing:-.04em}.hero .v small{font-size:15px;color:#a1a1aa}
.leg{display:flex;gap:14px;font-size:12.5px;color:#d4d4d8;margin-top:4px}
.k2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k2 .l{font-size:12px;color:var(--mute)}.k2 .v{font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:2px}.s{font-size:11.5px;color:var(--mute)}
.red{color:var(--red)}.mute{color:var(--mute)}.sm{font-size:13px}.pad{padding:10px 16px;margin:0}.grow{flex:1;min-width:0}.full{width:100%;margin-top:10px}.strike{text-decoration:line-through;opacity:.5}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.al{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.al:first-of-type{border-top:0}
.al span{flex:1;display:flex;flex-direction:column}.al small{color:var(--mute);font-size:12px}
.ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;background:var(--soft);flex:none}.ic.a{background:var(--amberbg);color:var(--amber)}.ic.r{background:var(--redbg);color:var(--red)}
.li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px}.li:first-child{border-top:0}
.li .grow{display:flex;flex-direction:column}.li small{font-size:12px}.li .r{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--soft);white-space:nowrap}.tag.g{background:var(--wash);color:var(--forest)}.tag.w{background:var(--amberbg);color:var(--amber)}.tag.r{background:var(--redbg);color:var(--red)}
.vc .top{display:flex;justify-content:space-between;align-items:center}.vc h3{font-size:16px;margin:8px 0 2px;letter-spacing:-.01em}
.cmp{display:flex;margin:12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.cmp div{flex:1;padding:8px 10px;border-left:1px solid var(--line)}.cmp div:first-child{border-left:0}.cmp small{display:block;font-size:11px;color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:12px}.b2{all:unset;box-sizing:border-box;flex:1;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;text-align:center}
.b2.no{border:1px solid var(--line);background:#fff}.b2.yes{background:var(--ink);color:#fff}.b2:active{transform:scale(.98)}
.note{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.prog{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--ink)}
.vbars{display:flex;align-items:flex-end;gap:3px;height:140px}.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}.vb i{width:100%;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px}.vb span{font-size:9.5px;color:var(--mute)}
.br{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:5px 0}.bt{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bt i{display:block;height:100%;background:var(--ink)}
.tabs{display:flex;border-top:1px solid var(--line);background:#fff;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);position:relative;cursor:pointer;padding:4px 0}
.tabs button.on{color:var(--ink)}.tabs svg{width:22px;height:22px}.tabs em{position:absolute;top:-2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
.login{height:100%;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px}
.lbox{background:#fff;border-radius:22px;padding:26px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}.lbox h1{margin:0;font-size:22px}.lbox p{margin:0}
.lbox label{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:13px;color:var(--mute)}
.logo{width:60px;height:60px;border-radius:16px;background:var(--lime);color:var(--forest);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
.lnk{all:unset;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}.sheet p{margin:0}
#toasts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;width:max-content;max-width:90vw}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;text-align:center}
</style>
</head>
<body>
<div id="app"></div><div id="toasts" aria-live="polite"></div>
<script src="fbx.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
