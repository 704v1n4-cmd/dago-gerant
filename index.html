.th .grow{display:flex;flex-direction:column}.th b{font-size:15px;font-weight:700}.th small{font-size:12px;color:var(--mute)}.th:focus-visible{outline:2px solid var(--aline);outline-offset:2px}
.sw{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);flex:none}.sw.auto{background:linear-gradient(90deg,#f5f6f8 50%,#0b0d10 50%)}.sw.light{background:linear-gradient(90deg,#f5f6f8 50%,#fff 50%)}.sw.dark{background:linear-gradient(90deg,#0b0d10 50%,#14171c 50%)}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);box-sizing:border-box;flex:none;position:relative}.th.on .rd{border-color:var(--aline)}.th.on .rd:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--aline)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline-color:var(--aline)}
.obj .ct{margin-bottom:4px}.lk{all:unset;cursor:pointer;color:var(--aline);font-weight:700;font-size:14px;padding:10px 0 10px 12px;margin:-10px 0}.lk:focus-visible{outline:2px solid var(--aline)}
.gr{padding:10px 0;border-top:1px solid var(--line)}.gr:first-of-type{border-top:0}.gt{display:flex;justify-content:space-between;gap:8px;font-size:14px}.gt>span:first-child{font-weight:600}
.gb{position:relative;height:10px;border-radius:5px;background:var(--card2);margin:7px 0 6px}.gb i{display:block;height:100%;border-radius:5px;background:var(--chart)}.gb i.done{background:var(--good)}
.gb u{position:absolute;top:-3px;width:2px;height:16px;margin-left:-1px;background:var(--ink);border-radius:1px}
.gs{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:12px}.gs .ok{color:var(--good);font-weight:700}.gs .lt{color:var(--amber);font-weight:700}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--sub);margin-top:6px}.fl small{font-weight:400;color:var(--mute);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.b2:active{transform:none}}

<body>
<div id="app"><div class="login"><div class="lbox"><div class="logo">DMS</div><p>Chargement de l'app…</p><p class="mute sm" id="bootmsg"></p><button class="b2 ghost full" id="bootfix" hidden>Réparer l'app (vider le cache)</button></div></div></div><div id="toasts" aria-live="polite"></div>
<script>
/* Si l'app ne démarre pas : afficher l'erreur et proposer de vider le cache. */
window.DG_BOOT={ok:false,err:""};
window.addEventListener("error",function(e){DG_BOOT.err=(e&&e.message)||"Erreur inconnue";var m=document.getElementById("bootmsg");if(m)m.textContent="Erreur : "+DG_BOOT.err});
window.addEventListener("unhandledrejection",function(e){var r=e&&e.reason;DG_BOOT.err=String((r&&(r.message||r.code))||r||"");var m=document.getElementById("bootmsg");if(m&&!DG_BOOT.ok)m.textContent="Erreur : "+DG_BOOT.err});
function dgFix(){var b=document.getElementById("bootfix");if(b)b.textContent="Réparation…";
 var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(R){return Promise.all(R.map(function(r){return r.unregister()}))}))}catch(e){}
 try{if(window.caches)p.push(caches.keys().then(function(K){return Promise.all(K.map(function(k){return caches.delete(k)}))}))}catch(e){}
 Promise.all(p).catch(function(){}).then(function(){location.replace(location.pathname+"?r="+Date.now())})}
setTimeout(function(){if(DG_BOOT.ok)return;var b=document.getElementById("bootfix"),m=document.getElementById("bootmsg");if(b){b.hidden=false;b.onclick=dgFix}if(m&&!m.textContent)m.textContent="Le démarrage prend trop de temps (réseau lent ?). Vous pouvez réparer l'app : vos réglages et votre connexion sont gardés."},15000);
</script>
