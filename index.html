function dgFix(){var b=document.getElementById("bootfix");if(b)b.textContent="Réparation…";
 var p=[];try{localStorage.setItem("dg_nopersist","1")}catch(e){}
 try{["firestore/[DEFAULT]/dago-caisse/main","firebaseLocalStorageDb","firebase-heartbeat-database","firebase-installations-database"].forEach(function(n){p.push(new Promise(function(ok){var r=indexedDB.deleteDatabase(n);r.onsuccess=r.onerror=r.onblocked=function(){ok()};setTimeout(ok,2500)}))})}catch(e){}try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(R){return Promise.all(R.map(function(r){return r.unregister()}))}))}catch(e){}
