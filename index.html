<!doctype html>
<html lang="fr">
<script>try{if(localStorage.getItem("dg_theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dago Gérant">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Dago Moto Shop — Gérant</title>
<link rel="preload" href="Inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;src:url(Inter.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* Thème sombre par défaut ; html[data-theme=light] pour le clair (Plus › Apparence) */
:root{--bg:#09090b;--card:#18181b;--card2:#27272a;--line:#27272a;--ink:#fafafa;--mute:#a1a1aa;--sub:#d4d4d8;
 --accent:#a3e635;--onaccent:#1a2e05;--good:#4ade80;--goodbg:#052e16;--red:#f87171;--redbg:#450a0a;--amber:#fbbf24;--amberbg:#422006;
 --hero:#a3e635;--onhero:#1a2e05;--field:#09090b;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
html[data-theme=light]{--bg:#f4f4f5;--card:#fff;--card2:#f4f4f5;--line:#e4e4e7;--ink:#09090b;--mute:#52525b;--sub:#3f3f46;
 --good:#166534;--goodbg:#f0fdf4;--red:#b91c1c;--redbg:#fef2f2;--amber:#b45309;--amberbg:#fffbeb;--hero:#09090b;--onhero:#fff;--field:#fff;--shadow:0 10px 30px rgba(0,0,0,.15);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-feature-settings:"cv05" 1,"cv08" 1,"tnum" 1;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--field);color:var(--ink);font-size:16px}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.mh{padding:calc(env(safe-area-inset-top) + 18px) 16px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mh small{display:block;color:var(--mute);font-size:13px;font-weight:600}.mh h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--goodbg);color:var(--good);white-space:nowrap}
.sync:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.sync.w{background:var(--amberbg);color:var(--amber)}
.warnbar{margin:0 16px 10px;padding:12px 14px;border-radius:14px;background:var(--amberbg);color:var(--amber);font-size:14px;font-weight:600}
.body{flex:1;overflow:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:12px}
h2{font-size:15px;font-weight:700;color:var(--mute);margin:8px 2px -2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.card.list{padding:2px 14px}
.hero{background:var(--hero);color:var(--onhero);border:0;border-radius:20px;padding:18px}
.hero .l{font-size:13px;font-weight:700;opacity:.85}.hero .v{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:4px}.hero .v small{font-size:17px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;font-weight:600;opacity:.85;margin-top:2px}
.hero.g4{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hero.g4 .v{font-size:22px;margin-top:0}.hero.g4 .s{font-size:12px;font-weight:600;opacity:.85;color:inherit}
.k2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k2 .l{font-size:12px;font-weight:600;color:var(--mute)}.k2 .v{font-size:20px;font-weight:800;margin-top:4px;line-height:1.2}.s{font-size:12px;color:var(--mute)}
.red{color:var(--red)}.amb{color:var(--amber)}.mute{color:var(--mute)}.sm{font-size:13px}.pad{padding:12px 0;margin:0}.grow{flex:1;min-width:0}.full{width:100%;margin-top:10px}.strike{text-decoration:line-through;opacity:.5}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.wlink{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:14px;min-height:56px;border-radius:16px;background:var(--amberbg);color:var(--amber);font-weight:700;cursor:pointer;width:100%}
.wlink.r{background:var(--redbg);color:var(--red)}.wlink .grow small{display:block;font-weight:500;font-size:12px;opacity:.9}.wlink svg{width:22px;height:22px;flex:none}
.al{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.al:first-of-type{border-top:0}
.al span{flex:1;display:flex;flex-direction:column}.al small{color:var(--mute);font-size:12px}
.ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;background:var(--card2);flex:none}.ic.a{background:var(--amberbg);color:var(--amber)}.ic.r{background:var(--redbg);color:var(--red)}.ic.g{background:var(--goodbg);color:var(--good)}
.li{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.li:first-child{border-top:0}
.li .grow{display:flex;flex-direction:column}.li .grow b{font-weight:700}.li small{font-size:12px}.li .r{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--sub);white-space:nowrap}.tag.g{background:var(--goodbg);color:var(--good)}.tag.w{background:var(--amberbg);color:var(--amber)}.tag.r{background:var(--redbg);color:var(--red)}
.vc{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}.vc .top{display:flex;justify-content:space-between;gap:10px}.vc h3{font-size:18px;font-weight:800;margin:0;line-height:1.3}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}.cmp div{background:var(--card2);border-radius:12px;padding:10px 6px}.cmp div.bad{background:var(--redbg);color:var(--red)}
.cmp small{display:block;font-size:11px;font-weight:600;color:var(--mute)}.cmp div.bad small{color:inherit}.cmp b{font-weight:800}
.motif{font-size:14px;color:var(--sub);line-height:1.5}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b2{all:unset;box-sizing:border-box;min-height:52px;padding:0 14px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;cursor:pointer;text-align:center}
.b2.no{border:2px solid var(--red);color:var(--red)}.b2.yes{background:var(--accent);color:var(--onaccent)}.b2.ghost{border:1px solid var(--line);background:var(--card2);color:var(--ink);font-weight:700;font-size:15px;min-height:46px}
.b2.full{width:100%;margin-top:10px}.vc .top .tag{align-self:flex-start}.b2:active{transform:scale(.98)}.b2 svg{width:18px;height:18px}.b2:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{padding:10px 12px;border-radius:12px;background:var(--card2);font-size:14px}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.prog{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--accent)}
.vbars{display:flex;align-items:flex-end;gap:6px;height:150px}.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vb i{width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}.vb span{font-size:11px;color:var(--mute)}.vb b{font-size:10px;font-weight:700;color:var(--sub)}
.hb{margin-top:10px}.hb:first-of-type{margin-top:0}.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hb .t span{font-weight:600}
.bt{display:block;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:5px}.bt i{display:block;height:100%;background:var(--sub);border-radius:4px}.bt.a i{background:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto}.chip{all:unset;box-sizing:border-box;height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.dc{display:flex;flex-direction:column;gap:10px}.dc .top{display:flex;justify-content:space-between;gap:10px}.dc .top b{font-size:16px;font-weight:800}.dc .amt{text-align:right;flex:none}.dc .amt b{font-size:17px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--card);padding:6px 4px calc(env(safe-area-inset-bottom) + 8px)}
.tabs button{all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;font-weight:500;color:var(--mute);cursor:pointer}
.tabs .pill{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
.tabs button.on{color:var(--ink);font-weight:700}.tabs button.on .pill{background:var(--accent);color:var(--onaccent)}
.tabs svg{width:22px;height:22px}.tabs em{position:absolute;top:-4px;right:-8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#dc2626;color:#fff;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card2);border-radius:12px;padding:4px}.seg button{all:unset;min-height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer}.seg button.on{background:var(--card);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.login{height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}.lbox h1{margin:0;font-size:22px;font-weight:800}.lbox p{margin:0}
.lbox label{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;font-weight:600;color:var(--sub)}
.pw{display:flex;gap:6px}.pw input{flex:1}.eye{all:unset;width:48px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub)}.eye svg{width:20px;height:20px}
.logo{width:60px;height:60px;border-radius:16px;background:var(--accent);color:var(--onaccent);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
.lnk{all:unset;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:14px;padding:8px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px}.sheet p{margin:0}.sheet .acts .b2.no{border-color:var(--line);color:var(--ink)}
#toasts{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;width:max-content;max-width:90vw}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;box-shadow:var(--shadow)}
button.card,button.hero,.tap{font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none}
button.card,button.hero{width:100%;display:block;position:relative}button.card{background:var(--card);border:1px solid var(--line)}button.hero{border:0}
button.card:after{content:"";position:absolute;top:16px;right:14px;width:7px;height:7px;border-right:2px solid var(--mute);border-top:2px solid var(--mute);transform:rotate(45deg);opacity:.7}
button.hero:after{content:"";position:absolute;top:22px;right:20px;width:9px;height:9px;border-right:2.5px solid currentColor;border-top:2.5px solid currentColor;transform:rotate(45deg);opacity:.6}
.tap.in{all:unset;box-sizing:border-box;display:block;cursor:pointer;border-radius:12px;padding:6px;margin:-6px}.tap.in:focus-visible{outline:2px solid var(--onhero)}
button.li{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}button.li:first-child{border-top:0}
button.li .grow{display:flex;flex-direction:column}button.li:focus-visible,button.card:focus-visible,button.hero:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.card:active,button.hero:active,button.li:active{opacity:.85}
.tgs{display:flex!important;flex-direction:row!important;flex-wrap:wrap;gap:4px;margin-top:4px}.tgs .tag{margin:0}.sheet.big{max-height:88vh;padding:0;gap:0}.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.sh-t{margin:0;font-size:19px;font-weight:800;color:var(--ink)}.x{all:unset;width:44px;height:44px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.x svg{width:20px;height:20px}
.x:focus-visible{outline:2px solid var(--accent)}.sh-b{overflow:auto;padding:0 18px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:8px}
.sh-s{margin:10px 2px 0;font-size:14px;font-weight:700;color:var(--mute)}.sh-tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card2)}.sh-tot span{font-weight:600;color:var(--sub)}.sh-tot b{font-size:20px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.b2:active{transform:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toasts" aria-live="polite"></div>
<script src="fbx.min.js"></script>
<script src="config.js?v=22"></script>
<script src="app.js?v=22"></script>
</body>
</html>
